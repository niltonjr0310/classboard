# Modelo das variáveis do backend. No Render, cadastre cada uma em Environment
# (não precisa deste arquivo). Para uso local, coloque no backend/.env.
DATABASE_URL: "postgresql://USUARIO:SENHA@HOST-pooler.neon.tech/neondb?sslmode=require"
GOOGLE_CLIENT_ID: "SEU-CLIENT-ID.apps.googleusercontent.com"
JWT_SECRET: "COLE-AQUI-O-SEGREDO-GERADO"
ADMIN_EMAILS: "seu-email@gmail.com"
# E-mails de aviso (recomendado no Render): API do Brevo
BREVO_API_KEY: "chave-da-api-do-brevo"
EMAIL_FROM: "remetente-verificado-no-brevo@gmail.com"
# Alternativa local (SMTP do Gmail; o Render gratuito bloqueia SMTP)
GMAIL_USER: "gmail-do-classboard@gmail.com"
GMAIL_APP_PASSWORD: "senha-de-app-sem-espacos"
# Opcional: endereço do site (usado no link do e-mail de consentimento e no CORS).
# Se não definir, vale https://classboard-three.vercel.app. Com domínio próprio, defina aqui.
FRONTEND_URL: "https://seu-site.com.br"
# Opcional: várias origens permitidas no CORS, separadas por vírgula (substitui FRONTEND_URL no CORS).
CORS_ORIGINS: "https://seu-site.com.br,https://www.seu-site.com.br"
